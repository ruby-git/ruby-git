name: Warm Bundler Caches

# GitHub Actions scopes every cache to the ref that wrote it. A run can read the
# caches written at its own ref, at its base ref, and at the default branch, and no
# others. The CI workflow runs on `pull_request`, where github.ref is
# refs/pull/<n>/merge, so the caches it writes are visible to that one PR and nothing
# else. The result is that nearly every PR paid a cold `bundle install` on nearly
# every job. See issue #1674 for the measurements.
#
# This workflow exists solely to write those caches from the branches PRs use as
# their base, so that a PR's *first* run can read them. It does no checkout-and-test
# work beyond what `bundler-cache: true` needs: no specs, no RuboCop, no YARD.
#
# The matrix below must stay in sync with continuous_integration.yml: setup-ruby's
# cache key embeds the runner OS, the resolved Ruby version, and the Gemfile.lock hash,
# so a pair that is not warmed here still starts cold in CI. That includes the lint
# job's Ruby 3.4 and the Windows 3.2 job, neither of which appears in CI's main matrix
# list. The head rubies from experimental_continuous_integration.yml are deliberately
# absent: that workflow already runs on `push: [main]` and warms its own caches.
#
# The same scoping means a maintenance branch is warmed only by the copy of this file
# on that branch, with that branch's own matrix -- the copy on main is never what runs
# for a push to a maintenance branch. This copy lists `5.x` because it lives on the
# 5.x branch; 4.x carries no copy and is not warmed.
on:
  push:
    branches: [main, 5.x]

  workflow_dispatch:

# Deliberately NOT cancel-in-progress. Two merges landing close together would
# otherwise cancel the first one's warming mid-save, which is the opposite of the
# point; queueing them costs a couple of runner-minutes and always leaves a warm cache
# behind. This group is also distinct from CI's because github.workflow differs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Warm Ruby ${{ matrix.ruby }} on ${{ matrix.operating-system }}

    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            operating-system: ubuntu-latest

          - # Hosts the lint and locale jobs in continuous_integration.yml
            ruby: "3.4"
            operating-system: ubuntu-latest

          - ruby: "4.0"
            operating-system: ubuntu-latest

          - ruby: "truffleruby-24.2.1"
            operating-system: ubuntu-latest

          - ruby: "jruby-10.0.0.1"
            operating-system: ubuntu-latest

          - ruby: "3.2"
            operating-system: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # No bundler-* inputs here on purpose. setup-ruby folds its `bundler`, `with`,
      # `without`, and `only` inputs into the cache key, so any option set here and not
      # in continuous_integration.yml would warm a key CI never looks up.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
