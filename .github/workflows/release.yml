---
name: Release Gem

# This workflow creates a new release on GitHub and publishes the gem to
# RubyGems.org.
#
# The workflow uses the `googleapis/release-please-action` to handle the
# release creation process and the `rubygems/release-gem` action to publish
# the gem to rubygems.org

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: RubyGems
      url: https://rubygems.org/gems/git

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # workflow_dispatch can be run from any branch or tag, so stop unless the
      # ref is the branch in the push filter above. Push events are already
      # limited by that filter, so the step runs only for workflow_dispatch.
      # The check is a shell step rather than a step-level `if` on the ref:
      # workflow expressions compare strings case-insensitively, while branch
      # names are case-sensitive.
      - name: Require a release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo "::error::$GITHUB_REF is not a release branch"; exit 1 ;;
          esac

      - name: Checkout project
        uses: actions/checkout@v6

      - name: Create release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        if: ${{ steps.release.outputs.release_created }}
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1
        if: ${{ steps.release.outputs.release_created }}
