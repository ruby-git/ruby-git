---
name: Release Gem

# This workflow creates a new release on GitHub and publishes the gem to
# RubyGems.org.
#
# The workflow uses the `googleapis/release-please-action` to handle the
# release creation process and the `rubygems/release-gem` action to publish
# the gem to rubygems.org

on:
  push:
    branches: ["main", "4.x", "5.x"]

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: RubyGems
      url: https://rubygems.org/gems/git

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # workflow_dispatch can be run from any branch or tag, so stop unless the
      # ref is one of the branches in the push filter above. This is a shell step
      # rather than a job-level `if`: workflow expressions compare strings
      # case-insensitively, while branch names are case-sensitive.
      - name: Require a release branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/heads/4.x | refs/heads/5.x) ;;
            *) echo "::error::$GITHUB_REF is not a release branch"; exit 1 ;;
          esac

      - name: Checkout project
        uses: actions/checkout@v6

      - name: Create release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        if: ${{ steps.release.outputs.release_created }}
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1
        if: ${{ steps.release.outputs.release_created }}
